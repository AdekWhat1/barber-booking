upstream django_app {
    server web:8000;
}

# Редірект з HTTP на HTTPS
server {
    listen 80;
    server_name barber-booking.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Робота сайту по HTTPS
server {
    listen 443 ssl;
    server_name barber-booking.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/barber-booking.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/barber-booking.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}